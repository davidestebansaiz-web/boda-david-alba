openapi: 3.0.3
info:
  title: Wedding Invitations API
  version: 1.0.0
  description: Contract-first API for public RSVP by token and admin invitation CRUD.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Public RSVP
  - name: Admin Auth
  - name: Admin Invitations

paths:
  /public/invitations/{token}:
    get:
      tags: [Public RSVP]
      operationId: getPublicInvitationByToken
      summary: Get invitation RSVP context by public token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 12
      responses:
        '200':
          description: Invitation context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInvitationContext'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/invitations/{token}/rsvp:
    post:
      tags: [Public RSVP]
      operationId: submitPublicRsvpByToken
      summary: Submit RSVP by public token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicRsvpSubmission'
      responses:
        '200':
          description: RSVP saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRsvpSubmissionResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/auth/login:
    post:
      tags: [Admin Auth]
      operationId: adminLogin
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/invitations:
    post:
      tags: [Admin Invitations]
      operationId: createAdminInvitation
      summary: Create invitation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInvitationCreateRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvitation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Admin Invitations]
      operationId: listAdminInvitations
      summary: List invitations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invitation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminInvitation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/invitations/{invitationId}:
    get:
      tags: [Admin Invitations]
      operationId: getAdminInvitationById
      summary: Get invitation by id
      security:
        - BearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvitation'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Admin Invitations]
      operationId: updateAdminInvitation
      summary: Update invitation by id
      security:
        - BearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInvitationUpdateRequest'
      responses:
        '200':
          description: Updated invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvitation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Admin Invitations]
      operationId: deleteAdminInvitation
      summary: Delete invitation by id
      security:
        - BearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    RsvpStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED]

    Rsvp:
      type: object
      required: [status, submittedAt, updatedAt, inviteeResponses]
      properties:
        status:
          $ref: '#/components/schemas/RsvpStatus'
        attendingCount:
          type: integer
          minimum: 0
          nullable: true
        message:
          type: string
          maxLength: 1000
          nullable: true
        inviteeResponses:
          type: array
          items:
            $ref: '#/components/schemas/InviteeRsvpResponse'
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Invitee:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string

    InviteeRsvpResponse:
      type: object
      required: [inviteeId, attending, note]
      properties:
        inviteeId:
          type: string
        attending:
          type: boolean
        note:
          type: string
          description: Invitee message persisted with the RSVP
          maxLength: 1000
          nullable: true

    PublicInvitationContext:
      type: object
      required: [invitationId, token, guestName, maxGuests, invitees, currentResponses]
      properties:
        invitationId:
          type: string
        token:
          type: string
        guestName:
          type: string
        maxGuests:
          type: integer
          minimum: 1
        invitees:
          type: array
          items:
            $ref: '#/components/schemas/Invitee'
        currentResponses:
          type: array
          items:
            $ref: '#/components/schemas/InviteeRsvpResponse'

    PublicRsvpSubmission:
      type: object
      required: [invitees]
      properties:
        invitees:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublicInviteeRsvpSubmission'
      additionalProperties: false

    PublicInviteeRsvpSubmission:
      type: object
      required: [inviteeId, attending]
      properties:
        inviteeId:
          type: string
        attending:
          type: boolean
        note:
          type: string
          description: Invitee message persisted with the RSVP
          maxLength: 1000
          nullable: true
      additionalProperties: false

    PublicRsvpSubmissionResult:
      type: object
      required: [invitationId, token, rsvp]
      properties:
        invitationId:
          type: string
        token:
          type: string
        rsvp:
          $ref: '#/components/schemas/Rsvp'

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false

    AdminLoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1

    AdminInvitation:
      type: object
      required:
        - id
        - token
        - guestName
        - maxGuests
        - qrTargetUrl
        - qrSvg
        - qrUpdatedAt
        - createdAt
        - updatedAt
        - rsvp
      properties:
        id:
          type: string
        token:
          type: string
        guestName:
          type: string
        maxGuests:
          type: integer
          minimum: 1
        adminNotes:
          type: string
          nullable: true
          maxLength: 1000
        qrTargetUrl:
          type: string
          format: uri
        qrSvg:
          type: string
        qrUpdatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rsvp:
          allOf:
            - $ref: '#/components/schemas/Rsvp'
          nullable: true

    AdminInvitationCreateRequest:
      type: object
      required: [guestName, maxGuests]
      properties:
        token:
          type: string
          minLength: 12
        qrTargetUrl:
          type: string
          format: uri
        guestName:
          type: string
          minLength: 1
          maxLength: 200
        maxGuests:
          type: integer
          minimum: 1
        adminNotes:
          type: string
          maxLength: 1000
      additionalProperties: false

    AdminInvitationUpdateRequest:
      type: object
      properties:
        guestName:
          type: string
          minLength: 1
          maxLength: 200
        maxGuests:
          type: integer
          minimum: 1
        adminNotes:
          type: string
          maxLength: 1000
          nullable: true
        qrTargetUrl:
          type: string
          format: uri
        regenerateQr:
          type: boolean
      additionalProperties: false
